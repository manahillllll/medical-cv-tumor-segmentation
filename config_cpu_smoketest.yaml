seed: 42

# Small-scale variant of config.yaml for verifying the pipeline runs correctly on a
# CPU-only machine before committing to a real (GPU) training run. Smaller patch size
# and a narrower U-Net so a few epochs finish in seconds/minutes rather than hours.
# Use with: python scripts/train_segmentation.py --config config_cpu_smoketest.yaml

data:
  format: "h5_slices"
  data_dir: "data/brats2020_h5/BraTS2020_training_data/content/data"
  patch_size: [64, 64, 64]
  val_fraction: 0.15
  cache: false
  num_workers: 2

model:
  in_channels: 4
  num_seg_classes: 4
  base_filters: 8
  depth: 3
  dropout_p: 0.2
  num_cls_classes: 2
  cls_dropout_p: 0.3

loss:
  weight_dice: 1.0
  weight_ce: 1.0
  include_background_in_dice: true

train_segmentation:
  batch_size: 1
  num_epochs: 30
  lr: 0.001
  weight_decay: 0.00001
  amp: false
  val_every: 5
  overfit_single_batch: true
  checkpoint_dir: "checkpoints/segmentation_smoketest"
  log_dir: "outputs/logs/segmentation_smoketest"

train_classifier:
  batch_size: 2
  num_epochs: 10
  lr: 0.0001
  weight_decay: 0.00001
  freeze_encoder_epochs: 3
  seg_checkpoint: "checkpoints/segmentation_smoketest/best.pt"
  checkpoint_dir: "checkpoints/classifier_smoketest"
  log_dir: "outputs/logs/classifier_smoketest"

inference:
  patch_size: [64, 64, 64]
  overlap: 0.5
  sliding_window_batch_size: 1

uncertainty:
  method: "mc_dropout"
  mc_samples: 8
  ensemble_checkpoints: []

report:
  output_dir: "outputs/reports"
